[package]
name = "better-yzu-campus-network"
version = "1.0.3"
edition = "2021"
description = "扬州大学校园网自动登录和断线重连脚本"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "cookies"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["menu", "cursor", "textbox"] }
winapi = { version = "0.3", features = ["handleapi", "processenv", "shellapi", "winbase", "wincon", "winuser"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
