[package]
name = "better-yzu-campus-network"
version = "0.1.0"
edition = "2021"
description = "扬州大学校园网自动登录和断线重连脚本"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "cookies"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
