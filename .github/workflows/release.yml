name: Release

# 打 tag 触发（如 v1.0.0），也可在 Actions 页面手动验证构建
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: better-yzu-campus-network

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 单个平台失败不影响其余平台出包
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          # 黑苹果 / Intel Mac
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链与目标平台
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: 缓存依赖与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: 校验标签与程序版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', '标签与 Cargo.toml 版本不一致'
          PY

      - name: 单元测试
        run: cargo test --all-targets --target ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: 准备 Windows UI 自动化环境
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Windows UI 自动化依赖
        if: runner.os == 'Windows'
        run: python -m pip install pywinauto==0.6.9 Pillow==11.1.0

      - name: Windows 窗口与命令行冒烟测试
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
        run: python .github/scripts/windows-smoke.py target/${{ matrix.target }}/release/better-yzu-campus-network.exe

      - name: 上传 Windows 界面截图与诊断
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-smoke
          path: artifacts/windows-ui/
          if-no-files-found: warn

      # 校园网网关在 CI 中不可达，Linux 冒烟仅验证启动和参数读取。
      - name: 冒烟测试
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cp config.example.toml config.toml
          sed -i 's/^user_id = ""/user_id = "ci-test-user"/; s/^password = ""/password = "ci-test-password"/' config.toml

          set -o pipefail
          timeout 120 "./target/${{ matrix.target }}/release/${BIN_NAME}" --once | tee run.log

          grep -q "启动了喵" run.log || { echo "未看到启动横幅"; exit 1; }
          echo "启动正常"

      - name: 整理待发布文件
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" dist/
          cp config.example.toml README.md dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: better-yzu-campus-network-*
          path: artifacts

      - name: 打包为 zip
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done
          ls -lh *.zip

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip
