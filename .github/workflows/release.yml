name: Release

# 打 tag 触发（如 v0.1.0），也可在 Actions 页面手动运行
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: better-yzu-campus-network

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 单个平台失败不影响其余平台出包
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          # 黑苹果 / Intel Mac
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链与目标平台
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: 缓存依赖与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      # 只在 Linux 上跑冒烟测试：`timeout` 在 macOS 上不存在，
      # Windows 的 Git Bash 会解析到 System32 里那个语义完全不同的 timeout.exe。
      # 其余平台只验证能否编译出可执行文件。
      - name: 冒烟测试
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cp config.example.toml config.toml
          sed -i 's/^user_id = ""/user_id = "ci-test-user"/; s/^password = ""/password = "ci-test-password"/' config.toml

          set -o pipefail
          timeout 120 "./target/${{ matrix.target }}/release/${BIN_NAME}" --once | tee run.log

          grep -q "启动了喵" run.log || { echo "未看到启动横幅"; exit 1; }
          echo "启动正常"

      - name: 整理待发布文件
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" dist/
          cp config.example.toml README.md dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包为 zip
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done
          ls -lh *.zip

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip
