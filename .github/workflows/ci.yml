name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: better-yzu-campus-network

jobs:
  build-and-run:
    name: 编译与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: 缓存依赖与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 格式检查
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: 提供 CI 格式化文件（不需要本地 Rust）
        if: matrix.os == 'ubuntu-latest' && steps.format.outcome == 'failure'
        run: cargo fmt --all

      - name: 上传格式化文件
        if: matrix.os == 'ubuntu-latest' && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: src/*.rs

      - name: 单元测试
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 编译发行程序
        run: cargo build --release

      - name: Linux 命令行冒烟测试
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp config.example.toml config.toml
          sed -i 's/^user_id = ""/user_id = "ci-test-user"/; s/^password = ""/password = "ci-test-password"/' config.toml
          set -o pipefail
          timeout 30 "./target/release/${BIN_NAME}" --once | tee run.log
          grep -q "启动了喵" run.log
          "./target/release/${BIN_NAME}" --help
          # GitHub 不在校园网中；这里验证启动，不声称实际登录成功。

      - name: 准备 Windows UI 自动化环境
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Windows UI 自动化依赖
        if: runner.os == 'Windows'
        run: python -m pip install pywinauto==0.6.9 Pillow==11.1.0

      - name: Windows 窗口与命令行冒烟测试
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
        run: python .github/scripts/windows-smoke.py target/release/better-yzu-campus-network.exe

      - name: 上传 Windows 界面截图与诊断
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-smoke
          path: artifacts/windows-ui/
          if-no-files-found: warn

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ runner.os }}
          path: |
            target/release/${{ env.BIN_NAME }}
            target/release/${{ env.BIN_NAME }}.exe
          if-no-files-found: error

      - name: 上传依赖锁文件
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
